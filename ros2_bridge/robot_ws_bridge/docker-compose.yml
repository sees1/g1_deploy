services:
  robot-ws-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      WS_AUTH_TOKEN: "change_me"
      WS_HOST: "0.0.0.0"
      WS_PORT: "8765"
      CMD_VEL_TOPIC: "/cmd_vel"
      MOCK_STATUS_TICK_MS: "500"
    ports:
      - "8765:8765"

